<!doctype html>
<html>
    <head>
        <meta http-equiv="Cache-Control" content="no-store" />
        <META HTTP-EQUIV="Pragma" CONTENT="no-cache">
            <META HTTP-EQUIV="Expires" CONTENT="-1">
    </head>
    <body>
        <table style="border: 1px;border-color: black;width: 400px">
            <tr>
                <td style="width: 200px;"><ul id="statuslist"></ul></td>
                <td><ul id="loglist"></ul></td>
                <td><ul id="monitorlist"></ul></td>
                
            </tr>
            
        </table>
        
    </body>

    <script type="text/javascript">
        const log_eventSrc = new EventSource("http://127.0.0.1:8080/log");
        const status_eventSrc = new EventSource("http://127.0.0.1:8080/status");
        const monitor_eventSrc = new EventSource("http://127.0.0.1:8080/monitor");

        const loglist = document.getElementById("loglist");
        const statuslist = document.getElementById("statuslist");
        const monitorlist = document.getElementById("monitorlist");
        
        status_eventSrc.addEventListener("status", function(e) {
            const li = document.createElement("li");
            li.textContent = `status: ${event.data}`;
            statuslist.appendChild(li);
          })
       
          monitor_eventSrc.addEventListener("monitor", function(e) {
            const li = document.createElement("li");
            li.textContent = `monitor: ${event.data}`;
            monitorlist.appendChild(li);
          })
       
          
        log_eventSrc.addEventListener("log", function(e) {
            const li = document.createElement("li");
            li.textContent = `info: ${event.data}`;
            loglist.appendChild(li);
         })
       
         log_eventSrc.open = (e) => {
            console.log("EventSource :", e);
         };
        
         log_eventSrc.onerror = (err) => {
            console.error("EventSource failed:", err);
        };
        
        status_eventSrc.open = (e) => {
            console.log("EventSource :", e);
         };
        
        status_eventSrc.onerror = (err) => {
            console.error("EventSource failed:", err);
        };
        
          
        monitor_eventSrc.open = (e) => {
            console.log("EventSource :", e);
         };
        
        monitor_eventSrc.onerror = (err) => {
            console.error("EventSource failed:", err);
        };
    </script>
</html>
